<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Kiosk pedestal/stand -->
  <rect x="175" y="420" width="50" height="50" rx="4" fill="#004643"/>
  <rect x="155" y="465" width="90" height="16" rx="4" fill="#004643"/>
  <!-- Kiosk body frame -->
  <rect x="100" y="60" width="200" height="370" rx="16" fill="#004643"/>
  <!-- Screen bezel inner -->
  <rect x="112" y="72" width="176" height="346" rx="12" fill="#FAF4D3"/>
  <!-- Screen content -->
  <!-- Top bar -->
  <rect x="112" y="72" width="176" height="40" rx="12" fill="#004643"/>
  <rect x="112" y="90" width="176" height="22" fill="#004643"/>
  <text x="200" y="98" font-size="13" font-weight="bold" fill="#FAF4D3" text-anchor="middle" font-family="sans-serif">MediKiosk</text>
  <!-- ABHA badge -->
  <circle cx="240" cy="93" r="9" fill="#FAF4D3" opacity="0.2"/>
  <!-- Status indicator - green -->
  <circle cx="272" cy="93" r="4" fill="#4CAF50"/>
  <!-- Main screen content area -->
  <!-- Welcome card -->
  <rect x="124" y="124" width="152" height="50" rx="8" fill="#F6BE9A" opacity="0.6"/>
  <text x="200" y="145" font-size="10" fill="#004643" text-anchor="middle" font-family="sans-serif" font-weight="bold">नमस्ते / Hello</text>
  <text x="200" y="162" font-size="9" fill="#004643" text-anchor="middle" font-family="sans-serif">Ready for intake</text>
  <!-- Microphone button -->
  <circle cx="200" cy="230" r="38" fill="#004643"/>
  <circle cx="200" cy="230" r="32" fill="#FAF4D3"/>
  <!-- Mic icon -->
  <rect x="193" y="212" width="14" height="22" rx="7" fill="#004643"/>
  <path d="M186 228 C186 240 214 240 214 228" fill="none" stroke="#004643" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="240" x2="200" y2="246" stroke="#004643" stroke-width="2.5"/>
  <line x1="193" y1="246" x2="207" y2="246" stroke="#004643" stroke-width="2.5"/>
  <!-- Sound waves -->
  <path d="M182 222 C178 226 178 234 182 238" fill="none" stroke="#D1AC00" stroke-width="2" stroke-linecap="round"/>
  <path d="M218 222 C222 226 222 234 218 238" fill="none" stroke="#D1AC00" stroke-width="2" stroke-linecap="round"/>
  <!-- Language selector -->
  <rect x="124" y="280" width="42" height="22" rx="5" fill="#004643"/>
  <text x="145" y="296" font-size="9" fill="#FAF4D3" text-anchor="middle" font-family="sans-serif">EN</text>
  <rect x="172" y="280" width="42" height="22" rx="5" fill="#FAF4D3" stroke="#004643" stroke-width="1"/>
  <text x="193" y="296" font-size="9" fill="#004643" text-anchor="middle" font-family="sans-serif">हिं</text>
  <rect x="220" y="280" width="42" height="22" rx="5" fill="#FAF4D3" stroke="#004643" stroke-width="1"/>
  <text x="241" y="296" font-size="9" fill="#004643" text-anchor="middle" font-family="sans-serif">தமி</text>
  <!-- Progress bar -->
  <rect x="124" y="314" width="152" height="6" rx="3" fill="#FAF4D3" stroke="#004643" stroke-width="1"/>
  <rect x="124" y="314" width="45" height="6" rx="3" fill="#D1AC00"/>
  <text x="200" y="330" font-size="8" fill="#004643" text-anchor="middle" font-family="sans-serif">Step 1 of 5</text>
  <!-- Bottom action button -->
  <rect x="124" y="378" width="152" height="32" rx="8" fill="#D1AC00"/>
  <text x="200" y="399" font-size="11" fill="#0C1618" text-anchor="middle" font-family="sans-serif" font-weight="bold">Start Intake</text>
  <!-- ABHA badge on kiosk body -->
  <circle cx="138" cy="76" r="7" fill="#FAF4D3" opacity="0.9"/>
  <text x="138" y="79" font-size="5" fill="#004643" text-anchor="middle" font-family="sans-serif">ABHA</text>
  <!-- Kiosk edge highlights -->
  <rect x="100" y="60" width="4" height="370" rx="2" fill="#FAF4D3" opacity="0.08"/>
</svg>
