<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#004643" stroke-width="0.4" opacity="0.3"/>
    </pattern>
    <pattern id="dots" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="1.2" fill="#004643" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>
  <!-- Concentric circles -->
  <circle cx="600" cy="400" r="200" fill="none" stroke="#004643" stroke-width="0.5" opacity="0.2"/>
  <circle cx="600" cy="400" r="320" fill="none" stroke="#004643" stroke-width="0.5" opacity="0.15"/>
  <circle cx="600" cy="400" r="450" fill="none" stroke="#004643" stroke-width="0.5" opacity="0.1"/>
  <circle cx="600" cy="400" r="580" fill="none" stroke="#004643" stroke-width="0.4" opacity="0.08"/>
  <!-- Offset circles -->
  <circle cx="100" cy="100" r="160" fill="none" stroke="#004643" stroke-width="0.4" opacity="0.15"/>
  <circle cx="1100" cy="700" r="200" fill="none" stroke="#004643" stroke-width="0.4" opacity="0.15"/>
  <!-- Medical cross symbols -->
  <g opacity="0.12" fill="#004643">
    <rect x="188" y="182" width="24" height="8"/>
    <rect x="196" y="174" width="8" height="24"/>
    <rect x="890" y="295" width="20" height="6"/>
    <rect x="897" y="288" width="6" height="20"/>
    <rect x="310" y="620" width="16" height="5"/>
    <rect x="316" y="614" width="5" height="16"/>
    <rect x="1050" y="150" width="18" height="6"/>
    <rect x="1056" y="144" width="6" height="18"/>
  </g>
  <!-- Diagonal lines -->
  <line x1="0" y1="0" x2="300" y2="800" stroke="#004643" stroke-width="0.4" opacity="0.08"/>
  <line x1="200" y1="0" x2="500" y2="800" stroke="#004643" stroke-width="0.4" opacity="0.06"/>
  <line x1="900" y1="0" x2="600" y2="800" stroke="#004643" stroke-width="0.4" opacity="0.08"/>
  <line x1="1100" y1="0" x2="800" y2="800" stroke="#004643" stroke-width="0.4" opacity="0.06"/>
</svg>
