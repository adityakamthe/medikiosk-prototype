<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes scatter-to-timeline {
      0%, 10% { opacity: 1; transform: translate(0,0) rotate(var(--r,0deg)); }
      40%, 60% { opacity: 0.4; transform: translate(var(--tx,0px), var(--ty,0px)) rotate(0deg); }
      80%, 100% { opacity: 1; transform: translate(var(--fx,0px), var(--fy,0px)) rotate(0deg); }
    }
    @keyframes line-appear {
      0%, 50% { stroke-dashoffset: 900; opacity: 0; }
      70%, 100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes pulse-node {
      0%, 100% { r: 6; opacity: 0.7; }
      50% { r: 9; opacity: 1; }
    }
    @keyframes label-fade {
      0%, 55% { opacity: 0; }
      75%, 100% { opacity: 1; }
    }
    .paper { animation: scatter-to-timeline 4s ease-in-out infinite; }
    .timeline-line { stroke-dasharray: 900; stroke-dashoffset: 900; animation: line-appear 4s ease-in-out infinite; }
    .node { animation: pulse-node 2s ease-in-out infinite; }
    .label { animation: label-fade 4s ease-in-out infinite; }
  </style>
  <!-- Background -->
  <rect width="900" height="320" fill="#0C1618"/>
  <!-- Scattered paper records (left side) -->
  <g style="--r:-12deg; --tx:150px; --ty:-10px; --fx:240px; --fy:-60px" class="paper" transform-origin="120 180">
    <rect x="60" y="150" width="90" height="110" rx="4" fill="#FAF4D3" stroke="#D1AC00" stroke-width="1.5"/>
    <line x1="72" y1="172" x2="138" y2="172" stroke="#004643" stroke-width="1.5"/>
    <line x1="72" y1="184" x2="138" y2="184" stroke="#004643" stroke-width="1"/>
    <line x1="72" y1="196" x2="120" y2="196" stroke="#004643" stroke-width="1"/>
    <rect x="60" y="150" width="30" height="14" rx="2" fill="#F6BE9A"/>
    <text x="66" y="161" font-size="8" fill="#004643" font-family="sans-serif">Rx</text>
  </g>
  <g style="--r:8deg; --tx:120px; --ty:20px; --fx:230px; --fy:30px; animation-delay:0.3s" class="paper" transform-origin="155 220">
    <rect x="100" y="195" width="80" height="95" rx="4" fill="#FAF4D3" stroke="#004643" stroke-width="1"/>
    <line x1="112" y1="215" x2="168" y2="215" stroke="#004643" stroke-width="1.5"/>
    <line x1="112" y1="226" x2="168" y2="226" stroke="#004643" stroke-width="1"/>
    <line x1="112" y1="237" x2="148" y2="237" stroke="#004643" stroke-width="1"/>
    <text x="108" y="210" font-size="7" fill="#004643" font-family="sans-serif">Lab Report</text>
  </g>
  <g style="--r:-5deg; --tx:80px; --ty:-30px; --fx:210px; --fy:-80px; animation-delay:0.6s" class="paper" transform-origin="80 130">
    <rect x="30" y="80" width="75" height="90" rx="4" fill="#FAF4D3" stroke="#004643" stroke-width="1"/>
    <line x1="40" y1="98" x2="94" y2="98" stroke="#004643" stroke-width="1.5"/>
    <line x1="40" y1="108" x2="94" y2="108" stroke="#004643" stroke-width="1"/>
    <line x1="40" y1="118" x2="78" y2="118" stroke="#004643" stroke-width="1"/>
    <text x="36" y="95" font-size="7" fill="#004643" font-family="sans-serif">OPD Card</text>
  </g>
  <!-- MediKiosk arrow/transform indicator -->
  <g class="label">
    <circle cx="300" cy="160" r="28" fill="#D1AC00"/>
    <path d="M288 160 L312 160 M305 153 L312 160 L305 167" stroke="#0C1618" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="300" y="198" font-size="9" fill="#D1AC00" font-family="sans-serif" text-anchor="middle">MediKiosk</text>
  </g>
  <!-- Structured timeline (right side) -->
  <!-- Main timeline line -->
  <line x1="380" y1="160" x2="860" y2="160" stroke="#D1AC00" stroke-width="2.5" class="timeline-line" stroke-linecap="round"/>
  <!-- Timeline nodes with labels -->
  <g class="label" style="animation-delay:0.5s">
    <circle cx="420" cy="160" r="8" fill="#004643" stroke="#D1AC00" stroke-width="2"/>
    <rect x="400" y="100" width="80" height="50" rx="6" fill="#FAF4D3"/>
    <text x="440" y="120" font-size="8" fill="#004643" font-family="sans-serif" text-anchor="middle" font-weight="bold">Identity</text>
    <text x="440" y="133" font-size="7" fill="#004643" font-family="sans-serif" text-anchor="middle">ABHA Auth</text>
    <text x="440" y="144" font-size="7" fill="#004643" font-family="sans-serif" text-anchor="middle">DPDP Consent</text>
    <line x1="440" y1="150" x2="440" y2="152" stroke="#D1AC00" stroke-width="1.5"/>
  </g>
  <g class="label" style="animation-delay:0.8s">
    <circle cx="540" cy="160" r="8" fill="#004643" stroke="#D1AC00" stroke-width="2"/>
    <rect x="505" y="180" width="80" height="50" rx="6" fill="#F6BE9A"/>
    <text x="545" y="200" font-size="8" fill="#004643" font-family="sans-serif" text-anchor="middle" font-weight="bold">Intake</text>
    <text x="545" y="213" font-size="7" fill="#004643" font-family="sans-serif" text-anchor="middle">22 languages</text>
    <text x="545" y="224" font-size="7" fill="#004643" font-family="sans-serif" text-anchor="middle">SOCRATES</text>
    <line x1="540" y1="168" x2="540" y2="180" stroke="#D1AC00" stroke-width="1.5"/>
  </g>
  <g class="label" style="animation-delay:1.1s">
    <circle cx="660" cy="160" r="8" fill="#004643" stroke="#D1AC00" stroke-width="2"/>
    <rect x="625" y="100" width="80" height="50" rx="6" fill="#FAF4D3"/>
    <text x="665" y="120" font-size="8" fill="#004643" font-family="sans-serif" text-anchor="middle" font-weight="bold">Documents</text>
    <text x="665" y="133" font-size="7" fill="#004643" font-family="sans-serif" text-anchor="middle">OCR + Drugs</text>
    <text x="665" y="144" font-size="7" fill="#004643" font-family="sans-serif" text-anchor="middle">Lab Flags</text>
    <line x1="660" y1="150" x2="660" y2="152" stroke="#D1AC00" stroke-width="1.5"/>
  </g>
  <g class="label" style="animation-delay:1.4s">
    <circle cx="780" cy="160" r="8" fill="#D1AC00" stroke="#D1AC00" stroke-width="2"/>
    <rect x="745" y="180" width="95" height="50" rx="6" fill="#004643" stroke="#D1AC00" stroke-width="1.5"/>
    <text x="793" y="200" font-size="8" fill="#D1AC00" font-family="sans-serif" text-anchor="middle" font-weight="bold">Summary</text>
    <text x="793" y="213" font-size="7" fill="#FAF4D3" font-family="sans-serif" text-anchor="middle">FHIR R4 Bundle</text>
    <text x="793" y="224" font-size="7" fill="#FAF4D3" font-family="sans-serif" text-anchor="middle">Dual Language</text>
    <line x1="780" y1="168" x2="780" y2="180" stroke="#D1AC00" stroke-width="1.5"/>
  </g>
</svg>
